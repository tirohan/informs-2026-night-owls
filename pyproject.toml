[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "night-owls"
version = "1.0.0"
description = "INFORMS 2026 DMS challenge: county OSI trajectory forecasting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.3.5",
    "pandas==2.2.3",
    "scipy==1.17.0",
    "scikit-learn==1.8.0",
    "lightgbm==4.6.0",
    "threadpoolctl==3.6.0",
    "torch==2.14.0",
]

[project.optional-dependencies]
report = ["matplotlib==3.10.8"]

[project.scripts]
night-owls = "night_owls.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
night_owls = ["data/*"]
